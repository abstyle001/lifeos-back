[project]
name = "back"
version = "0.1.0"
description = "LifeOS backend - personal data visualization dashboard API"
readme = "README.md"
authors = [
    { name = "AB-style", email = "100179990+abstyle001@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
]

[project.scripts]
back = "back.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
